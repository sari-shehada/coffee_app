name: coffee_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/
    - assets/images/
    - assets/images/products/

  fonts:
    - family: Sora
      fonts:
        - asset: fonts/Sora-ExtraBold.ttf
          weight: 800
        - asset: fonts/Sora-Bold.ttf
          weight: 700
        - asset: fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: fonts/Sora-Medium.ttf
          weight: 500
        - asset: fonts/Sora-Regular.ttf
          weight: 400
        - asset: fonts/Sora-Light.ttf
          weight: 300
        - asset: fonts/Sora-ExtraLight.ttf
          weight: 200
        - asset: fonts/Sora-Thin.ttf
          weight: 100